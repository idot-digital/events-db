image: idotdigital/builder

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GO111MODULE: "on"
  CGO_ENABLED: "0"
  DOCKER_IMAGE: idotdigital/eventsdb
  DOCKER_TAG: ${CI_COMMIT_SHA}

stages:
  - build
  - docker
  - release

before_script:
  - mkdir -p $GOPATH/bin
  - export PATH="$PATH:$HOME/go/bin"
  - go mod download

.build_template: &build_definition
  stage: build
  script:
    - mkdir -p bin
    - make proto sqlc
    - go build -o bin/eventsdb-$GOOS-$GOARCH cmd/server/main.go
  artifacts:
    paths:
      - bin/
    expire_in: 1 week

build_linux_amd64:
  <<: *build_definition
  variables:
    GOOS: linux
    GOARCH: amd64

build_linux_arm64:
  <<: *build_definition
  variables:
    GOOS: linux
    GOARCH: arm64

build_darwin_amd64:
  <<: *build_definition
  variables:
    GOOS: darwin
    GOARCH: amd64

build_darwin_arm64:
  <<: *build_definition
  variables:
    GOOS: darwin
    GOARCH: arm64

build_windows_amd64:
  <<: *build_definition
  variables:
    GOOS: windows
    GOARCH: amd64

build_windows_arm64:
  <<: *build_definition
  variables:
    GOOS: windows
    GOARCH: arm64

docker:
  stage: docker
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache docker-cli-buildx
    - docker login -u luiskugel -p $DOCKER_TOKEN
    - docker buildx create --use
    - docker buildx inspect --bootstrap
  script:
    - mkdir -p docker-bin
    - cp bin/eventsdb-linux-amd64 docker-bin/
    - cp bin/eventsdb-linux-arm64 docker-bin/
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --build-arg BINARY_AMD64=docker-bin/eventsdb-linux-amd64 \
        --build-arg BINARY_ARM64=docker-bin/eventsdb-linux-arm64 \
        -t $DOCKER_IMAGE:$DOCKER_TAG \
        -t $DOCKER_IMAGE:latest \
        --push \
        .
  dependencies:
    - build_linux_amd64
    - build_linux_arm64
  only:
    - main
    - tags

typescript-http-client:
  stage: build
  script:
    - cd client/typescript-http
    - npm install
    - npm run build
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm publish
    - echo $'@idot-digital:registry=https://git.idot.digital/api/v4/packages/npm/\n//git.idot.digital/api/v4/projects/104/packages/npm/:_authToken="${CI_JOB_TOKEN}"' > .npmrc
    - npm publish

typescript-grpc-client:
  stage: build
  script:
    - cd client/typescript-grpc
    - npm install
    - npm run build
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm publish
    - echo $'@idot-digital:registry=https://git.idot.digital/api/v4/packages/npm/\n//git.idot.digital/api/v4/projects/104/packages/npm/:_authToken="${CI_JOB_TOKEN}"' > .npmrc
    - npm publish

release:
  stage: release
  image: alpine:latest
  script:
    - |
      for os in linux darwin windows; do
        for arch in amd64 arm64; do
          if [ -f "bin/eventsdb-$os-$arch" ]; then
            tar -czf "eventsdb-$os-$arch.tar.gz" -C bin "eventsdb-$os-$arch"
          fi
        done
      done
  artifacts:
    paths:
      - "*.tar.gz"
    expire_in: 1 week
  only:
    - tags
