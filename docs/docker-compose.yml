version: "3.8"

services:
  app:
    image: idotdigital/eventsdb:latest
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - MYSQL_HOST=sql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE_NAME=root
      - LOG_LEVEL=DEBUG
      - AUTH_TOKEN=1234567890
      - TLS_CERT_FILE=/app/tmp/server.crt
      - TLS_KEY_FILE=/app/tmp/server.key
    depends_on:
      sql:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./tmp:/app/tmp
    restart: unless-stopped

  sql:
    image: mysql:8.0
    hostname: sql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
