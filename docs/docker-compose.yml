version: "3.8"

services:
  app:
    image: idotdigital/eventsdb:latest
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE_NAME=root
      - LOG_LEVEL=DEBUG # Set to INFO in production.
      - AUTH_TOKEN=some-secret-token
      - TLS_CERT_FILE=/app/example/server.crt #These certificates are only for quick testing. They are self-signed and should NEVER be used in production.
      - TLS_KEY_FILE=/app/example/server.key #These certificates are only for quick testing. They are self-signed and should NEVER be used in production.
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./config:/app/config
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    hostname: mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
